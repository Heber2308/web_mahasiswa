<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" name="viewport">
    <title>Mata Kuliah - Sistem Mahasiswa</title>

    <link rel="icon" href="assets/img/logo.png" type="image/png">

    <!-- General CSS Files -->
    <link rel="stylesheet" href="assets/modules/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/modules/fontawesome/css/all.min.css">

    <!-- Template CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">

    <style>
        /* ===== MAIN WRAPPER & CONTENT ===== */
        .main-wrapper {
            margin-left: 250px;
            min-height: 100vh;
            position: relative;
            z-index: 2;
        }

        .main-content {
            padding: 25px 30px;
        }

        /* ===== CONTENT CARDS ===== */
        .main-content .content-card {
            background: rgba(15, 23, 42, 0.80);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
        }

        .main-content .content-card:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .main-content .content-card .card-header {
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 20px;
            border-radius: 16px 16px 0 0;
        }

        .main-content .content-card .card-header h5 {
            color: #ffffff !important;
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0;
        }

        .main-content .content-card .card-header h5 i {
            color: #60a5fa !important;
            margin-right: 6px;
        }

        .main-content .content-card .card-body {
            padding: 16px 20px;
        }

        /* ===== TABLES ===== */
        .main-content .content-card .table {
            color: #ffffff !important;
            margin-bottom: 0;
        }

        .main-content .content-card .table thead th {
            color: #94a3b8 !important;
            background: rgba(255, 255, 255, 0.05) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 8px 10px;
        }

        .main-content .content-card .table tbody td {
            color: #e2e8f0 !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
            padding: 8px 10px;
            font-size: 0.85rem;
            vertical-align: middle;
        }

        .main-content .content-card .table tbody tr:hover {
            background: rgba(59, 130, 246, 0.08) !important;
        }

        .main-content .content-card .table tbody tr:last-child td {
            border-bottom: none;
        }

        .main-content .content-card .table-striped tbody tr:nth-of-type(odd) {
            background: rgba(255, 255, 255, 0.02);
        }

        /* ===== BUTTONS ===== */
        .btn-primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
        .btn-primary:hover { background: #2563eb; border-color: #2563eb; color: #fff; }
        .btn-success { background: #10b981; border-color: #10b981; color: #fff; }
        .btn-success:hover { background: #059669; border-color: #059669; color: #fff; }
        .btn-warning { background: #f59e0b; border-color: #f59e0b; color: #fff; }
        .btn-warning:hover { background: #d97706; border-color: #d97706; color: #fff; }
        .btn-info { background: #06b6d4; border-color: #06b6d4; color: #fff; }
        .btn-info:hover { background: #0891b2; border-color: #0891b2; color: #fff; }
        .btn-danger { background: #ef4444; border-color: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; border-color: #dc2626; color: #fff; }

        /* ===== MODAL DIALOGS ===== */
        .modal-content {
            background: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            color: #f8fafc;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .modal-header.bg-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb) !important;
        }

        .modal-header.bg-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
        }

        .modal-body label {
            color: #cbd5e1;
            font-weight: 500;
        }

        .modal-body .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
        }

        .modal-body .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #3b82f6;
            color: #f8fafc;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25);
        }

        .modal-body select.form-control option {
            background: #0f172a;
            color: #f8fafc;
        }

        @media (max-width: 991px) {
            .main-wrapper {
                margin-left: 0;
            }
            .main-content {
                padding: 15px;
            }
            .main-content .content-card .card-body {
                padding: 14px 16px;
            }
        }

        @media (max-width: 576px) {
            .main-content .content-card .card-body {
                padding: 12px 14px;
            }
            .main-content .content-card .table thead th,
            .main-content .content-card .table tbody td {
                padding: 6px 8px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== CONTAINER KOMPONEN ===== -->
    <div id="slideshow-container"></div>
    <div id="sidebar-container"></div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-wrapper">

        <!-- ===== HEADER ===== -->
        <div id="header-container"></div>

        <!-- ===== MAIN CONTENT ===== -->
        <div class="main-content">

            <!-- ===== TOMBOL TAMBAH ===== -->
            <div class="mb-3">
                <button class="btn btn-primary" onclick="bukaModalTambah()">
                    <i class="fas fa-plus"></i> Tambah Mata Kuliah
                </button>
            </div>

            <!-- ===== TABEL ===== -->
            <div class="card content-card">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-table"></i> Daftar Mata Kuliah</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>No</th>
                                    <th>Kode</th>
                                    <th>Nama Mata Kuliah</th>
                                    <th>Jurusan</th>
                                    <th>Semester</th>
                                    <th>SKS</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tabelMatakuliah"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

        <!-- ===== FOOTER ===== -->
        <div id="footer-container"></div>

    </div>

    <!-- ===== MODAL TAMBAH ===== -->
    <div class="modal fade" id="modalTambah" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="fas fa-book"></i> Tambah Mata Kuliah</h5>
                    <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="formTambah" onsubmit="return tambahMatakuliah()">
                        <div class="form-group">
                            <label>Kode</label>
                            <input type="text" class="form-control" id="kodeTambah" placeholder="Contoh: MK009" required>
                        </div>
                        <div class="form-group">
                            <label>Nama Mata Kuliah</label>
                            <input type="text" class="form-control" id="namaTambah" placeholder="Masukkan nama mata kuliah" required>
                        </div>
                        <div class="form-group">
                            <label>Jurusan</label>
                            <select class="form-control" id="jurusanTambah" required>
                                <option value="">-- Pilih --</option>
                                <option value="Informatika">Informatika</option>
                                <option value="Sistem Informasi">Sistem Informasi</option>
                                <option value="Teknik Komputer">Teknik Komputer</option>
                                <option value="Data Science">Data Science</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Semester</label>
                            <select class="form-control" id="semesterTambah" required>
                                <option value="">-- Pilih --</option>
                                <option value="1">Semester 1</option>
                                <option value="2">Semester 2</option>
                                <option value="3">Semester 3</option>
                                <option value="4">Semester 4</option>
                                <option value="5">Semester 5</option>
                                <option value="6">Semester 6</option>
                                <option value="7">Semester 7</option>
                                <option value="8">Semester 8</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>SKS</label>
                            <select class="form-control" id="sksTambah" required>
                                <option value="">-- Pilih --</option>
                                <option value="1">1 SKS</option>
                                <option value="2">2 SKS</option>
                                <option value="3">3 SKS</option>
                                <option value="4">4 SKS</option>
                                <option value="6">6 SKS</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success btn-block">Simpan</button>
                    </form>
                    <div id="pesanTambah" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MODAL EDIT ===== -->
    <div class="modal fade" id="modalEdit" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning text-white">
                    <h5 class="modal-title"><i class="fas fa-edit"></i> Edit Mata Kuliah</h5>
                    <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="formEdit" onsubmit="return editMatakuliah()">
                        <input type="hidden" id="editId">
                        <div class="form-group">
                            <label>Kode</label>
                            <input type="text" class="form-control" id="editKode" placeholder="Contoh: MK009" required>
                        </div>
                        <div class="form-group">
                            <label>Nama Mata Kuliah</label>
                            <input type="text" class="form-control" id="editNama" placeholder="Masukkan nama mata kuliah" required>
                        </div>
                        <div class="form-group">
                            <label>Jurusan</label>
                            <select class="form-control" id="editJurusan" required>
                                <option value="">-- Pilih --</option>
                                <option value="Informatika">Informatika</option>
                                <option value="Sistem Informasi">Sistem Informasi</option>
                                <option value="Teknik Komputer">Teknik Komputer</option>
                                <option value="Data Science">Data Science</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Semester</label>
                            <select class="form-control" id="editSemester" required>
                                <option value="">-- Pilih --</option>
                                <option value="1">Semester 1</option>
                                <option value="2">Semester 2</option>
                                <option value="3">Semester 3</option>
                                <option value="4">Semester 4</option>
                                <option value="5">Semester 5</option>
                                <option value="6">Semester 6</option>
                                <option value="7">Semester 7</option>
                                <option value="8">Semester 8</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>SKS</label>
                            <select class="form-control" id="editSks" required>
                                <option value="">-- Pilih --</option>
                                <option value="1">1 SKS</option>
                                <option value="2">2 SKS</option>
                                <option value="3">3 SKS</option>
                                <option value="4">4 SKS</option>
                                <option value="6">6 SKS</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-warning btn-block">Update</button>
                    </form>
                    <div id="pesanEdit" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- General JS Scripts -->
    <script src="assets/modules/jquery.min.js"></script>
    <script src="assets/modules/popper.js"></script>
    <script src="assets/modules/tooltip.js"></script>
    <script src="assets/modules/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/modules/nicescroll/jquery.nicescroll.min.js"></script>
    <script src="assets/modules/moment.min.js"></script>
    <script src="assets/js/stisla.js"></script>
    <script src="assets/js/scripts.js"></script>
    <script src="assets/js/custom.js"></script>
    <script src="assets/js/app-common.js"></script>
    <script src="assets/js/load-components.js"></script>
    <script src="assets/js/page/matakuliah.js"></script>
</body>
</html>
