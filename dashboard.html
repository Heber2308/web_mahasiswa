<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" name="viewport">
    <title>Dashboard - Sistem Mahasiswa</title>

    <link rel="icon" href="assets/img/logo.png" type="image/png">

    <!-- General CSS Files -->
    <link rel="stylesheet" href="assets/modules/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/modules/fontawesome/css/all.min.css">

    <!-- Template CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">

    <style>
        /* ===== MAIN WRAPPER & CONTENT ===== */
        .main-wrapper {
            margin-left: 250px;
            min-height: 100vh;
            position: relative;
            z-index: 2;
        }

        .main-content {
            padding: 25px 30px;
        }

        /* ===== STAT CARD ===== */
        .stat-card {
            border: none;
            border-radius: 16px;
            transition: all 0.3s ease;
            color: #fff;
            padding: 20px 24px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        .stat-card .stat-icon {
            font-size: 2.2rem;
            opacity: 0.3;
            position: absolute;
            right: 20px;
            bottom: 20px;
        }

        .stat-card .stat-number {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            line-height: 1.2;
            color: #ffffff;
        }

        .stat-card .stat-label {
            font-size: 0.85rem;
            opacity: 0.9;
            font-weight: 500;
            margin: 0;
            color: #f1f5f9;
        }

        .stat-card.bg-primary { background: linear-gradient(135deg, rgba(37, 99, 235, 0.85), rgba(29, 78, 216, 0.9)); }
        .stat-card.bg-success { background: linear-gradient(135deg, rgba(16, 185, 129, 0.85), rgba(5, 150, 105, 0.9)); }
        .stat-card.bg-warning { background: linear-gradient(135deg, rgba(245, 158, 11, 0.85), rgba(217, 119, 6, 0.9)); }
        .stat-card.bg-purple { background: linear-gradient(135deg, rgba(139, 92, 246, 0.85), rgba(109, 40, 217, 0.9)); }

        /* ===== CONTENT CARDS ===== */
        .main-content .content-card {
            background: rgba(15, 23, 42, 0.80);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
        }

        .main-content .content-card:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .main-content .content-card .card-header {
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 20px;
            border-radius: 16px 16px 0 0;
        }

        .main-content .content-card .card-header h5 {
            color: #ffffff !important;
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0;
        }

        .main-content .content-card .card-header h5 i {
            color: #60a5fa !important;
            margin-right: 6px;
        }

        .main-content .content-card .card-body {
            padding: 16px 20px;
        }

        /* ===== TABLES ===== */
        .main-content .content-card .table {
            color: #ffffff !important;
            margin-bottom: 0;
        }

        .main-content .content-card .table thead th {
            color: #94a3b8 !important;
            background: rgba(255, 255, 255, 0.05) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 8px 10px;
        }

        .main-content .content-card .table tbody td {
            color: #e2e8f0 !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
            padding: 8px 10px;
            font-size: 0.85rem;
            vertical-align: middle;
        }

        .main-content .content-card .table tbody tr:hover {
            background: rgba(59, 130, 246, 0.08) !important;
        }

        .main-content .content-card .table tbody tr:last-child td {
            border-bottom: none;
        }

        .main-content .content-card .table-striped tbody tr:nth-of-type(odd) {
            background: rgba(255, 255, 255, 0.02);
        }

        /* ===== AKTIVITAS LIST ===== */
        #aktivitasList {
            margin: 0;
            padding: 0;
        }

        #aktivitasList .list-group-item {
            background: transparent !important;
            color: #e2e8f0 !important;
            border: none !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06) !important;
            padding: 10px 0 !important;
            font-size: 0.9rem;
        }

        #aktivitasList .list-group-item:last-child {
            border-bottom: none !important;
        }

        #aktivitasList .list-group-item small {
            color: #94a3b8 !important;
            font-size: 0.7rem;
        }

        /* ===== BUTTONS ===== */
        .btn-primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
        .btn-primary:hover { background: #2563eb; border-color: #2563eb; color: #fff; }
        .btn-success { background: #10b981; border-color: #10b981; color: #fff; }
        .btn-success:hover { background: #059669; border-color: #059669; color: #fff; }
        .btn-warning { background: #f59e0b; border-color: #f59e0b; color: #fff; }
        .btn-warning:hover { background: #d97706; border-color: #d97706; color: #fff; }
        .btn-info { background: #06b6d4; border-color: #06b6d4; color: #fff; }
        .btn-info:hover { background: #0891b2; border-color: #0891b2; color: #fff; }
        .btn-danger { background: #ef4444; border-color: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; border-color: #dc2626; color: #fff; }

        @media (max-width: 991px) {
            .main-wrapper {
                margin-left: 0;
            }
            .main-content {
                padding: 15px;
            }
            .main-content .content-card .card-body {
                padding: 14px 16px;
            }
            #aktivitasList .list-group-item {
                font-size: 0.8rem;
                padding: 8px 0 !important;
            }
        }

        @media (max-width: 576px) {
            .stat-card .stat-number {
                font-size: 1.5rem;
            }
            .stat-card .stat-icon {
                font-size: 1.8rem;
            }
            .main-content .content-card .card-body {
                padding: 12px 14px;
            }
            .main-content .content-card .table thead th,
            .main-content .content-card .table tbody td {
                padding: 6px 8px;
                font-size: 0.75rem;
            }
            #aktivitasList .list-group-item {
                font-size: 0.75rem;
                padding: 6px 0 !important;
            }
        }
    </style>
</head>
<body>

    <!-- ===== CONTAINER KOMPONEN ===== -->
    <div id="slideshow-container"></div>
    <div id="sidebar-container"></div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-wrapper">

        <!-- ===== HEADER ===== -->
        <div id="header-container"></div>

        <!-- ===== MAIN CONTENT ===== -->
        <div class="main-content">

            <!-- ===== STATISTIK ===== -->
            <div class="row mb-4">
                <div class="col-xl-3 col-lg-4 col-md-6 mb-3">
                    <div class="stat-card bg-primary">
                        <div>
                            <p class="stat-label"><i class="fas fa-users"></i> Total Mahasiswa</p>
                            <h2 class="stat-number" id="totalMahasiswa">0</h2>
                        </div>
                        <div class="stat-icon">
                            <i class="fas fa-users"></i>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-lg-4 col-md-6 mb-3">
                    <div class="stat-card bg-primary">
                        <div>
                            <p class="stat-label"><i class="fas fa-user-tie"></i> Total Dosen</p>
                            <h2 class="stat-number" id="totalDosen">0</h2>
                        </div>
                        <div class="stat-icon">
                            <i class="fas fa-user-tie"></i>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-lg-4 col-md-6 mb-3">
                    <div class="stat-card bg-primary">
                        <div>
                            <p class="stat-label"><i class="fas fa-book"></i> Total Mata Kuliah</p>
                            <h2 class="stat-number" id="totalMatkul">0</h2>
                        </div>
                        <div class="stat-icon">
                            <i class="fas fa-book"></i>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-lg-4 col-md-6 mb-3">
                    <div class="stat-card bg-primary">
                        <div>
                            <p class="stat-label"><i class="fas fa-university"></i> Total Jurusan</p>
                            <h2 class="stat-number" id="totalJurusan">0</h2>
                        </div>
                        <div class="stat-icon">
                            <i class="fas fa-university"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ===== TABEL DATA TERBARU ===== -->
            <div class="row">
                <div class="col-12 mb-4">
                    <div class="card content-card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fas fa-users"></i> Mahasiswa Terbaru</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-sm table-hover mb-0">
                                    <thead>
                                        <tr>
                                            <th>Nama</th>
                                            <th>Jurusan</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabelMahasiswaTerbaru"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 mb-4">
                    <div class="card content-card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fas fa-user-tie"></i> Dosen Terbaru</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-sm table-hover mb-0">
                                    <thead>
                                        <tr>
                                            <th>Nama</th>
                                            <th>Jurusan</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabelDosenTerbaru"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 mb-4">
                    <div class="card content-card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fas fa-book"></i> Mata Kuliah Terbaru</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-sm table-hover mb-0">
                                    <thead>
                                        <tr>
                                            <th>Kode</th>
                                            <th>Mata Kuliah</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabelMatkulTerbaru"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ===== AKTIVITAS & AKSES CEPAT ===== -->
            <div class="row">
                <div class="col-12 mb-4">
                    <div class="card content-card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fas fa-bell"></i> Aktivitas Terbaru</h5>
                        </div>
                        <div class="card-body">
                            <ul class="list-group list-group-flush" id="aktivitasList"></ul>
                        </div>
                    </div>
                </div>
                <div class="col-12 mb-4">
                    <div class="card content-card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fas fa-rocket"></i> Akses Cepat</h5>
                        </div>
                        <div class="card-body">
                            <div class="row g-2">
                                <div class="col-md-3 col-sm-6">
                                    <a href="mahasiswa.html" class="btn btn-info w-100 py-2">
                                        <i class="fas fa-user-plus"></i> Kelola Mahasiswa
                                    </a>
                                </div>
                                <div class="col-md-3 col-sm-6">
                                    <a href="dosen.html" class="btn btn-info w-100 py-2">
                                        <i class="fas fa-chalkboard-teacher"></i> Kelola Dosen
                                    </a>
                                </div>
                                <div class="col-md-3 col-sm-6">
                                    <a href="matakuliah.html" class="btn btn-info w-100 py-2">
                                        <i class="fas fa-book"></i> Kelola Mata Kuliah
                                    </a>
                                </div>
                                <div class="col-md-3 col-sm-6">
                                    <button class="btn btn-info w-100 py-2" onclick="alert('Fitur Laporan')">
                                        <i class="fas fa-print"></i> Cetak Laporan
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- ===== FOOTER ===== -->
        <div id="footer-container"></div>

    </div>

    <!-- General JS Scripts -->
    <script src="assets/modules/jquery.min.js"></script>
    <script src="assets/modules/popper.js"></script>
    <script src="assets/modules/tooltip.js"></script>
    <script src="assets/modules/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/modules/nicescroll/jquery.nicescroll.min.js"></script>
    <script src="assets/modules/moment.min.js"></script>
    <script src="assets/js/stisla.js"></script>
    <script src="assets/js/scripts.js"></script>
    <script src="assets/js/custom.js"></script>
    <script src="assets/js/app-common.js"></script>
    <script src="assets/js/load-components.js"></script>
    <script src="assets/js/page/dashboard.js"></script>
</body>
</html>
