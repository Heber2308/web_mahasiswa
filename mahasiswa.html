<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" name="viewport">
    <title>Mahasiswa - Sistem Mahasiswa</title>

    <link rel="icon" href="assets/img/logo.png" type="image/png">

    <!-- General CSS Files -->
    <link rel="stylesheet" href="assets/modules/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/modules/fontawesome/css/all.min.css">

    <!-- Template CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">

    <!-- General Layout CSS -->
    <link rel="stylesheet" href="assets/css/layout.css">

    <!-- Page Specific CSS -->
    <link rel="stylesheet" href="assets/css/mahasiswa.css">
</head>
<body>

    <!-- ===== CONTAINER KOMPONEN ===== -->
    <div id="slideshow-container"></div>
    <div id="sidebar-container"></div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-wrapper">

        <!-- ===== HEADER ===== -->
        <div id="header-container"></div>

        <!-- ===== MAIN CONTENT ===== -->
        <div class="main-content">

            <!-- ===== TOMBOL TAMBAH ===== -->
            <div class="mb-3">
                <button class="btn btn-primary" onclick="bukaModalTambah()">
                    <i class="fas fa-plus"></i> Tambah Mahasiswa
                </button>
            </div>

            <div class="card content-card mb-3">
                <div class="card-body">
                    <div class="row align-items-end">
                        <div class="col-md-5 mb-2 mb-md-0">
                            <label for="pencarianMahasiswa">Cari mahasiswa</label>
                            <div class="input-group">
                                <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-search"></i></span></div>
                                <input type="search" class="form-control" id="pencarianMahasiswa" placeholder="Cari NIM atau nama...">
                            </div>
                        </div>
                        <div class="col-md-3 mb-2 mb-md-0">
                            <label for="filterJurusan">Filter jurusan</label>
                            <select class="form-control" id="filterJurusan">
                                <option value="">Semua jurusan</option>
                                <option value="Informatika">Informatika</option>
                                <option value="Sistem Informasi">Sistem Informasi</option>
                                <option value="Teknik Komputer">Teknik Komputer</option>
                                <option value="Data Science">Data Science</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="pengurutanMahasiswa">Urutkan data</label>
                            <select class="form-control" id="pengurutanMahasiswa">
                                <option value="default">Urutan awal</option>
                                <option value="nama-asc">Nama (A-Z)</option>
                                <option value="nama-desc">Nama (Z-A)</option>
                                <option value="ipk-desc">IPK tertinggi</option>
                                <option value="ipk-asc">IPK terendah</option>
                                <option value="nim-asc">NIM terkecil</option>
                                <option value="nim-desc">NIM terbesar</option>
                            </select>
                        </div>
                    </div>
                    <div id="statusFilterMahasiswa" class="text-muted mt-3" aria-live="polite"></div>
                </div>
            </div>

            <!-- ===== TABEL ===== -->
            <div class="card content-card">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-table"></i> Daftar Mahasiswa</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>No</th>
                                    <th>NIM</th>
                                    <th>Nama</th>
                                    <th>Jurusan</th>
                                    <th>IPK</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tabelMahasiswa"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

        <!-- ===== FOOTER ===== -->
        <div id="footer-container"></div>

    </div>

    <!-- ===== MODAL TAMBAH ===== -->
    <div class="modal fade" id="modalTambah" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="fas fa-user-plus"></i> Tambah Mahasiswa</h5>
                    <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="formTambah" onsubmit="return tambahMahasiswa()">
                        <div class="form-group">
                            <label>NIM</label>
                            <input type="text" class="form-control" id="nimTambah" placeholder="Masukkan NIM" required>
                        </div>
                        <div class="form-group">
                            <label>Nama</label>
                            <input type="text" class="form-control" id="namaTambah" placeholder="Masukkan nama" required>
                        </div>
                        <div class="form-group">
                            <label>Jurusan</label>
                            <select class="form-control" id="jurusanTambah" required>
                                <option value="">-- Pilih --</option>
                                <option value="Informatika">Informatika</option>
                                <option value="Sistem Informasi">Sistem Informasi</option>
                                <option value="Teknik Komputer">Teknik Komputer</option>
                                <option value="Data Science">Data Science</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>IPK</label>
                            <input type="number" step="0.01" class="form-control" id="ipkTambah" placeholder="0.00 - 4.00" required>
                        </div>
                        <button type="submit" class="btn btn-success btn-block">Simpan</button>
                    </form>
                    <div id="pesanTambah" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MODAL EDIT ===== -->
    <div class="modal fade" id="modalEdit" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning text-white">
                    <h5 class="modal-title"><i class="fas fa-edit"></i> Edit Mahasiswa</h5>
                    <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="formEdit" onsubmit="return editMahasiswa()">
                        <input type="hidden" id="editId">
                        <div class="form-group">
                            <label>NIM</label>
                            <input type="text" class="form-control" id="editNim" placeholder="Masukkan NIM" required>
                        </div>
                        <div class="form-group">
                            <label>Nama</label>
                            <input type="text" class="form-control" id="editNama" placeholder="Masukkan nama" required>
                        </div>
                        <div class="form-group">
                            <label>Jurusan</label>
                            <select class="form-control" id="editJurusan" required>
                                <option value="">-- Pilih --</option>
                                <option value="Informatika">Informatika</option>
                                <option value="Sistem Informasi">Sistem Informasi</option>
                                <option value="Teknik Komputer">Teknik Komputer</option>
                                <option value="Data Science">Data Science</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>IPK</label>
                            <input type="number" step="0.01" class="form-control" id="editIpk" placeholder="0.00 - 4.00" required>
                        </div>
                        <button type="submit" class="btn btn-warning btn-block">Update</button>
                    </form>
                    <div id="pesanEdit" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- General JS Scripts -->
    <script src="assets/modules/jquery.min.js"></script>
    <script src="assets/modules/popper.js"></script>
    <script src="assets/modules/tooltip.js"></script>
    <script src="assets/modules/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/modules/nicescroll/jquery.nicescroll.min.js"></script>
    <script src="assets/modules/moment.min.js"></script>
    <script src="assets/js/stisla.js"></script>
    <script src="assets/js/scripts.js"></script>
    <script src="assets/js/app-common.js"></script>
    <script src="assets/js/load-components.js"></script>
    <script src="assets/js/page/mahasiswa.js"></script>
</body>
</html>
