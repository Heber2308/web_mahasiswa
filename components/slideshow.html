    <div class="slide" style="background-image: url('assets/img/kampus2.jpg');"></div>

</div>

<style>
/* ===== SLIDESHOW BACKGROUND STYLES ===== */
.slideshow-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    overflow: hidden;
}

.slideshow-bg .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
}

.slideshow-bg .slide.active {
    opacity: 1;
}

.slideshow-bg::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.72) 0%, rgba(30, 41, 59, 0.78) 100%);
    z-index: 1;
}
</style>
