<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" name="viewport">
    <title>Register - Sistem Mahasiswa</title>

    <link rel="icon" href="assets/img/logo.png" type="image/png">

    <!-- General CSS Files -->
    <link rel="stylesheet" href="assets/modules/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/modules/fontawesome/css/all.min.css">

    <!-- CSS Libraries -->
    <link rel="stylesheet" href="assets/modules/jquery-selectric/selectric.css">
    <link rel="stylesheet" href="assets/modules/bootstrap-social/bootstrap-social.css">

    <!-- Template CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">

    <style>
        /* ===== SLIDESHOW BACKGROUND ===== */
        .slideshow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .slideshow-bg .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .slideshow-bg .slide.active {
            opacity: 1;
        }

        .slideshow-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.72) 0%, rgba(30, 41, 59, 0.78) 100%);
            z-index: 1;
        }

        /* ===== LOGO DI KIRI ATAS - TRANSPARAN ===== */
        .navbar-logo {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            background: transparent !important;
            border-radius: 0;
            box-shadow: none;
            backdrop-filter: none;
        }

        .navbar-logo:hover {
            transform: scale(1.05);
        }

        .navbar-logo img {
            height: 45px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
        }

        /* ===== APP CONTAINER ===== */
        #app {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 80px;
            padding-bottom: 20px;
        }

        section.section {
            padding: 20px 0;
            width: 100%;
        }

        /* ===== CARD AUTH ===== */
        .card {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
            border-radius: 16px;
        }

        .card-primary .card-header {
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px 25px 10px 25px;
        }

        .card-header h4 {
            color: #ffffff !important;
            font-weight: 700;
        }

        .card-body label {
            color: #cbd5e1;
            font-weight: 500;
            font-size: 0.85rem;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            border-radius: 8px;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #3b82f6;
            color: #ffffff;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25);
        }

        .custom-control-label {
            color: #cbd5e1;
        }

        /* ===== BUTTONS & LINKS ===== */
        .btn-primary {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }

        .btn-google {
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        .btn-google .fab {
            color: #60a5fa;
        }

        a {
            color: #60a5fa;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #93c5fd;
        }

        /* ===== FOOTER & NAVIGATION LINKS ===== */
        .simple-footer {
            color: rgba(255, 255, 255, 0.6) !important;
            font-weight: 400;
            padding: 10px 0;
        }

        .register-link,
        .login-link {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .register-link a,
        .login-link a {
            color: #60a5fa;
            font-weight: 600;
        }

        .register-link a:hover,
        .login-link a:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        .text-job {
            color: #94a3b8 !important;
        }

        /* ===== SHOW / HIDE PASSWORD ===== */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 50px;
            overflow: auto;
            white-space: nowrap;
        }

        .password-wrapper .form-control::-webkit-scrollbar {
            height: 3px;
        }

        .password-wrapper .form-control::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #94a3b8;
            cursor: pointer;
            padding: 4px 10px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            border-radius: 6px;
            min-width: 36px;
            height: 32px;
        }

        .toggle-password:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15) !important;
            border-color: rgba(59, 130, 246, 0.5);
        }

        .toggle-password:focus {
            outline: none;
        }

        .toggle-password i {
            font-size: 1rem;
        }

        /* ===== RESPONSIF ===== */
        @media (min-width: 992px) {
            .card-body {
                padding: 30px;
            }
            .navbar-logo img {
                height: 45px;
            }
            #app {
                padding-top: 80px;
            }
        }

        @media (max-width: 991px) and (min-width: 768px) {
            .card-body {
                padding: 25px;
            }
            .navbar-logo img {
                height: 35px;
            }
            .navbar-logo {
                top: 15px;
                left: 15px;
                padding: 4px 8px;
            }
            #app {
                padding-top: 75px;
            }
        }

        @media (max-width: 767px) {
            section.section {
                padding: 10px 0;
            }
            .card-body {
                padding: 18px;
            }
            .navbar-logo {
                top: 10px;
                left: 10px;
                padding: 3px 6px;
                background: transparent !important;
            }
            .navbar-logo img {
                height: 28px;
                filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
            }
            #app {
                padding-top: 80px !important;
                padding-bottom: 10px;
                align-items: flex-start;
            }
            .card-header h4 {
                font-size: 1.1rem;
            }
            .btn-lg {
                font-size: 0.95rem;
                padding: 8px 14px;
            }
            .register-link,
            .login-link {
                font-size: 0.8rem;
            }
            .text-job {
                font-size: 0.75rem;
            }
            .form-control {
                font-size: 14px;
                padding: 8px 12px;
            }
            .toggle-password {
                right: 5px;
                padding: 2px 8px;
                font-size: 0.95rem;
                min-width: 30px;
                height: 28px;
            }
            .password-wrapper .form-control {
                padding-right: 40px;
            }
        }

        @media (max-width: 400px) {
            .card-body {
                padding: 14px;
            }
            .navbar-logo {
                top: 8px;
                left: 8px;
                padding: 2px 5px;
            }
            .navbar-logo img {
                height: 22px;
                filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.7));
            }
            #app {
                padding-top: 70px !important;
            }
            .card-header h4 {
                font-size: 1rem;
            }
            .form-control {
                font-size: 13px;
                padding: 6px 10px;
            }
            .toggle-password {
                right: 4px;
                padding: 2px 6px;
                font-size: 0.85rem;
                min-width: 26px;
                height: 24px;
            }
            .password-wrapper .form-control {
                padding-right: 35px;
            }
            .btn-lg {
                font-size: 0.85rem;
                padding: 7px 12px;
            }
            .register-link,
            .login-link {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- ===== SLIDESHOW BACKGROUND ===== -->
    <div class="slideshow-bg">
        <div class="slide active" style="background-image: url('assets/img/kampus1.jpg');"></div>
        <div class="slide" style="background-image: url('assets/img/kampus2.jpg');"></div>
        <div class="slide" style="background-image: url('assets/img/kampus3.jpg');"></div>
    </div>

    <!-- ===== LOGO DI KIRI ATAS - TRANSPARAN ===== -->
    <div class="navbar-logo">
        <img src="assets/img/logo-panjang" alt="Logo">
    </div>

    <div id="app">
        <section class="section">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
                        <div class="card card-primary">
                            <div class="card-header">
                                <h4>Register</h4>
                            </div>

                            <div class="card-body">
                                <form id="formRegister" method="POST" onsubmit="return validasiRegistrasi()">

                                    <!-- ===== SEMUA FIELD AUTOCOMPLETE OFF ===== -->
                                    <div class="form-group">
                                        <label for="frist_name">First Name</label>
                                        <input id="frist_name" type="text" class="form-control" name="frist_name" autofocus required autocomplete="off">
                                    </div>

                                    <div class="form-group">
                                        <label for="last_name">Last Name</label>
                                        <input id="last_name" type="text" class="form-control" name="last_name" required autocomplete="off">
                                    </div>

                                    <div class="form-group">
                                        <label for="email">Email</label>
                                        <input id="email" type="email" class="form-control" name="email" required autocomplete="off">
                                    </div>

                                    <div class="form-group">
                                        <label for="password" class="d-block">Password</label>
                                        <div class="password-wrapper">
                                            <input id="password" type="password" class="form-control" name="password" required autocomplete="new-password">
                                            <button type="button" class="toggle-password" onclick="togglePassword('password', 'toggleIcon1')" tabindex="-1">
                                                <i class="fas fa-eye" id="toggleIcon1"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="password2" class="d-block">Konfirmasi Password</label>
                                        <div class="password-wrapper">
                                            <input id="password2" type="password" class="form-control" name="password-confirm" required autocomplete="new-password">
                                            <button type="button" class="toggle-password" onclick="togglePassword('password2', 'toggleIcon2')" tabindex="-1">
                                                <i class="fas fa-eye" id="toggleIcon2"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div id="pesanRegistrasi" class="mb-3"></div>

                                    <div class="form-group">
                                        <div class="custom-control custom-checkbox">
                                            <input type="checkbox" name="agree" class="custom-control-input" id="agree" required>
                                            <label class="custom-control-label" for="agree">I agree with the terms and conditions</label>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <button type="submit" class="btn btn-primary btn-lg btn-block">
                                            Daftar
                                        </button>
                                    </div>
                                </form>

                                <div class="login-link text-center">
                                    Sudah punya akun? <a href="auth-login.html">Login</a>
                                </div>

                                <div class="text-center mt-4 mb-3">
                                    <div class="text-job text-muted">Login Dengan Google</div>
                                </div>
                                <div class="row sm-gutters">
                                    <div class="col-12">
                                        <a class="btn btn-block btn-google">
                                            <span class="fab fa-google"></span> Google
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="simple-footer text-center">
                            Copyright &copy; Magang 2026
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- General JS Scripts -->
    <script src="assets/modules/jquery.min.js"></script>
    <script src="assets/modules/popper.js"></script>
    <script src="assets/modules/tooltip.js"></script>
    <script src="assets/modules/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/modules/nicescroll/jquery.nicescroll.min.js"></script>
    <script src="assets/modules/moment.min.js"></script>
    <script src="assets/js/stisla.js"></script>
    <script src="assets/modules/jquery-selectric/jquery.selectric.min.js"></script>
    <script src="assets/js/scripts.js"></script>
    <script src="assets/js/custom.js"></script>
    <script src="assets/js/page/auth-register.js"></script>
</body>
</html>
