<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" name="viewport">
    <title>Login - Sistem Mahasiswa</title>

    <link rel="icon" href="assets/img/logo.png" type="image/png">

    <!-- General CSS Files -->
    <link rel="stylesheet" href="assets/modules/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/modules/fontawesome/css/all.min.css">

    <!-- CSS Libraries -->
    <link rel="stylesheet" href="assets/modules/bootstrap-social/bootstrap-social.css">

    <!-- Template CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">

    <!-- Page Specific CSS -->
    <link rel="stylesheet" href="assets/css/auth-login.css">
</head>
<body>
    <!-- ===== SLIDESHOW BACKGROUND ===== -->
    <div class="slideshow-bg">
        <div class="slide active" style="background-image: url('assets/img/kampus1.jpg');"></div>
        <div class="slide" style="background-image: url('assets/img/kampus2.jpg');"></div>
        <div class="slide" style="background-image: url('assets/img/kampus3.jpg');"></div>
    </div>

    <!-- ===== LOGO DI KIRI ATAS - TRANSPARAN ===== -->
    <div class="navbar-logo">
        <img src="assets/img/logo-panjang" alt="Logo">
    </div>

    <div id="app">
        <section class="section">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
                        <div class="card card-primary">
                            <div class="card-header">
                                <h4>Login</h4>
                            </div>

                            <div class="card-body">
                                <form id="formLogin" method="POST" action="#" onsubmit="return validasiLogin()">
                                    <div class="form-group">
                                        <label for="email">Email</label>
                                        <input id="email" type="email" class="form-control" name="email" tabindex="1" required autofocus autocomplete="email">
                                    </div>

                                    <div class="form-group">
                                        <div class="d-block">
                                            <label for="password" class="control-label">Password</label>
                                            <div class="float-right">
                                                <a href="auth-forgot-password.html" class="text-small">
                                                    Lupa Password?
                                                </a>
                                            </div>
                                        </div>
                                        <div class="password-wrapper">
                                            <input id="password" type="password" class="form-control" name="password" tabindex="2" required autocomplete="new-password">
                                            <button type="button" class="toggle-password" onclick="togglePassword()" tabindex="-1" aria-label="Toggle Password">
                                                <i class="fas fa-eye" id="toggleIcon"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <div class="custom-control custom-checkbox">
                                            <input type="checkbox" name="remember" class="custom-control-input" tabindex="3" id="remember-me">
                                            <label class="custom-control-label" for="remember-me">Ingatkan Saya</label>
                                        </div>
                                    </div>

                                    <div id="pesanLogin" class="mb-3"></div>

                                    <div class="form-group">
                                        <button type="submit" class="btn btn-primary btn-lg btn-block" tabindex="4">
                                            Login
                                        </button>
                                    </div>
                                </form>

                                <div class="register-link text-center">
                                    Tidak Punya Akun? <a href="auth-register.html">Daftar</a>
                                </div>

                                <div class="text-center mt-4 mb-3">
                                    <div class="text-job text-muted">Login Dengan Google</div>
                                </div>
                                <div class="row sm-gutters">
                                    <div class="col-12">
                                        <a class="btn btn-block btn-google" href="#">
                                            <span class="fab fa-google"></span> Google
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="simple-footer text-center">
                            Copyright &copy; Magang 2026
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- General JS Scripts -->
    <script src="assets/modules/jquery.min.js"></script>
    <script src="assets/modules/popper.js"></script>
    <script src="assets/modules/tooltip.js"></script>
    <script src="assets/modules/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/modules/nicescroll/jquery.nicescroll.min.js"></script>
    <script src="assets/modules/moment.min.js"></script>
    <script src="assets/js/stisla.js"></script>
    <script src="assets/js/scripts.js"></script>
    <script src="assets/js/page/auth-login.js"></script>
</body>
</html>
