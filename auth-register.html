<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" name="viewport">
    <title>Register - Sistem Mahasiswa</title>

    <link rel="icon" href="assets/img/logo.png" type="image/png">

    <!-- General CSS Files -->
    <link rel="stylesheet" href="assets/modules/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/modules/fontawesome/css/all.min.css">

    <!-- CSS Libraries -->
    <link rel="stylesheet" href="assets/modules/jquery-selectric/selectric.css">
    <link rel="stylesheet" href="assets/modules/bootstrap-social/bootstrap-social.css">

    <!-- Template CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">

    <style>
        /* ===== SLIDESHOW BACKGROUND ===== */
        .slideshow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .slideshow-bg .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .slideshow-bg .slide.active {
            opacity: 1;
        }

        .slideshow-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* ===== LOGO DI KIRI ATAS - TRANSPARAN ===== */
        .navbar-logo {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            background: transparent !important;
            border-radius: 0;
            box-shadow: none;
            backdrop-filter: none;
        }

        .navbar-logo:hover {
            transform: scale(1.05);
        }

        .navbar-logo img {
            height: 55px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
        }

        #app {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 80px;
            padding-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            border: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .card-primary .card-header {
            background: transparent;
            border-bottom: 1px solid #e3e6f0;
        }

        .btn-primary {
            background: #4285F4;
            border-color: #4285F4;
        }
        .btn-primary:hover {
            background: #357ae8;
            border-color: #357ae8;
        }

        .btn-google {
            background: #ffffff;
            color: #3c4043;
            border: 1px solid #dadce0;
        }
        .btn-google:hover {
            background: #f8f9fa;
            border-color: #c6c8ca;
        }
        .btn-google .fab {
            color: #4285F4;
        }

        a {
            color: #4285F4;
        }
        a:hover {
            color: #357ae8;
        }

        .card-body label {
            color: #495057;
        }

        .simple-footer {
            color: #ffffff !important;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            font-weight: 400;
            padding: 10px 0;
        }

        .login-link {
            color: #495057;
            font-size: 0.9rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #e3e6f0;
        }
        .login-link a {
            color: #4285F4;
            font-weight: 600;
        }
        .login-link a:hover {
            color: #357ae8;
            text-decoration: underline;
        }

        section.section {
            padding: 20px 0;
            width: 100%;
        }

        /* ===== STYLE UNTUK SHOW PASSWORD ===== */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 50px;
            overflow: auto;
            white-space: nowrap;
        }

        .password-wrapper .form-control::-webkit-scrollbar {
            height: 3px;
        }

        .password-wrapper .form-control::-webkit-scrollbar-thumb {
            background: #c1c7cd;
            border-radius: 10px;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.95) !important;
            border: none;
            color: #6c757d;
            cursor: pointer;
            padding: 4px 10px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            border-radius: 4px;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05);
            min-width: 36px;
            height: 32px;
        }

        .toggle-password:hover {
            color: #4285F4;
            background: rgba(255, 255, 255, 1) !important;
            box-shadow: 0 0 0 1px rgba(66, 133, 244, 0.3);
        }

        .toggle-password:focus {
            outline: none;
        }

        .toggle-password i {
            font-size: 1rem;
        }

        /* ===== RESPONSIF ===== */
        
        /* Desktop & Laptop (> 992px) */
        @media (min-width: 992px) {
            .card-body {
                padding: 30px;
            }
            .navbar-logo img {
                height: 55px;
            }
            #app {
                padding-top: 80px;
            }
        }

        /* Tablet (768px - 991px) */
        @media (max-width: 991px) and (min-width: 768px) {
            .card-body {
                padding: 25px;
            }
            .navbar-logo img {
                height: 35px;
            }
            .navbar-logo {
                top: 15px;
                left: 15px;
                padding: 4px 8px;
            }
            #app {
                padding-top: 75px;
            }
        }

        /* HP & Tablet Kecil (< 768px) */
        @media (max-width: 767px) {
            section.section {
                padding: 10px 0;
            }
            .card-body {
                padding: 18px;
            }
            
            .navbar-logo {
                top: 10px;
                left: 10px;
                padding: 3px 6px;
                background: transparent !important;
            }
            .navbar-logo img {
                height: 28px;
                filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
            }
            
            #app {
                padding-top: 80px !important;
                padding-bottom: 10px;
                align-items: flex-start;
            }
            
            .card-header h4 {
                font-size: 1.1rem;
            }
            .btn-lg {
                font-size: 0.95rem;
                padding: 8px 14px;
            }
            .login-link {
                font-size: 0.8rem;
            }
            .text-job {
                font-size: 0.75rem;
            }
            .form-control {
                font-size: 14px;
                padding: 8px 12px;
            }
            .toggle-password {
                right: 5px;
                padding: 2px 8px;
                font-size: 0.95rem;
                min-width: 30px;
                height: 28px;
            }
            .password-wrapper .form-control {
                padding-right: 40px;
            }
        }

        /* HP Kecil (< 400px) */
        @media (max-width: 400px) {
            .card-body {
                padding: 14px;
            }
            .navbar-logo {
                top: 8px;
                left: 8px;
                padding: 2px 5px;
            }
            .navbar-logo img {
                height: 22px;
                filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.7));
            }
            
            #app {
                padding-top: 70px !important;
            }
            
            .card-header h4 {
                font-size: 1rem;
            }
            .form-control {
                font-size: 13px;
                padding: 6px 10px;
            }
            .toggle-password {
                right: 4px;
                padding: 2px 6px;
                font-size: 0.85rem;
                min-width: 26px;
                height: 24px;
            }
            .password-wrapper .form-control {
                padding-right: 35px;
            }
            .btn-lg {
                font-size: 0.85rem;
                padding: 7px 12px;
            }
            .login-link {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- ===== SLIDESHOW BACKGROUND ===== -->
    <div class="slideshow-bg">
        <div class="slide active" style="background-image: url('assets/img/kampus1.jpg');"></div>
        <div class="slide" style="background-image: url('assets/img/kampus2.jpg');"></div>
        <div class="slide" style="background-image: url('assets/img/kampus3.jpg');"></div>
    </div>

    <!-- ===== LOGO DI KIRI ATAS - TRANSPARAN ===== -->
    <div class="navbar-logo">
        <img src="assets/img/logo-panjang" alt="Logo">
    </div>

    <div id="app">
        <section class="section">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
                        <div class="card card-primary">
                            <div class="card-header">
                                <h4>Register</h4>
                            </div>

                            <div class="card-body">
                                <form id="formRegister" method="POST" onsubmit="return validasiRegistrasi()">

                                    <!-- ===== SEMUA FIELD AUTOCOMPLETE OFF ===== -->
                                    <div class="form-group">
                                        <label for="frist_name">First Name</label>
                                        <input id="frist_name" type="text" class="form-control" name="frist_name" autofocus required autocomplete="off">
                                    </div>

                                    <div class="form-group">
                                        <label for="last_name">Last Name</label>
                                        <input id="last_name" type="text" class="form-control" name="last_name" required autocomplete="off">
                                    </div>

                                    <div class="form-group">
                                        <label for="email">Email</label>
                                        <input id="email" type="email" class="form-control" name="email" required autocomplete="off">
                                    </div>

                                    <div class="form-group">
                                        <label for="password" class="d-block">Password</label>
                                        <div class="password-wrapper">
                                            <input id="password" type="password" class="form-control" name="password" required autocomplete="new-password">
                                            <button type="button" class="toggle-password" onclick="togglePassword('password', 'toggleIcon1')" tabindex="-1">
                                                <i class="fas fa-eye" id="toggleIcon1"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="password2" class="d-block">Konfirmasi Password</label>
                                        <div class="password-wrapper">
                                            <input id="password2" type="password" class="form-control" name="password-confirm" required autocomplete="new-password">
                                            <button type="button" class="toggle-password" onclick="togglePassword('password2', 'toggleIcon2')" tabindex="-1">
                                                <i class="fas fa-eye" id="toggleIcon2"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div id="pesanRegistrasi" class="mb-3"></div>

                                    <div class="form-group">
                                        <div class="custom-control custom-checkbox">
                                            <input type="checkbox" name="agree" class="custom-control-input" id="agree" required>
                                            <label class="custom-control-label" for="agree">I agree with the terms and conditions</label>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <button type="submit" class="btn btn-primary btn-lg btn-block">
                                            Daftar
                                        </button>
                                    </div>
                                </form>

                                <div class="login-link text-center">
                                    Sudah punya akun? <a href="auth-login.html">Login</a>
                                </div>

                                <div class="text-center mt-4 mb-3">
                                    <div class="text-job text-muted">Login Dengan Google</div>
                                </div>
                                <div class="row sm-gutters">
                                    <div class="col-12">
                                        <a class="btn btn-block btn-google">
                                            <span class="fab fa-google"></span> Google
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="simple-footer text-center">
                            Copyright &copy; Magang 2026
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- General JS Scripts -->
    <script src="assets/modules/jquery.min.js"></script>
    <script src="assets/modules/popper.js"></script>
    <script src="assets/modules/tooltip.js"></script>
    <script src="assets/modules/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/modules/nicescroll/jquery.nicescroll.min.js"></script>
    <script src="assets/modules/moment.min.js"></script>
    <script src="assets/js/stisla.js"></script>
    <script src="assets/modules/jquery-selectric/jquery.selectric.min.js"></script>
    <script src="assets/js/scripts.js"></script>
    <script src="assets/js/custom.js"></script>

    <script>
        // ===== SLIDESHOW BACKGROUND =====
        let slideIndex = 0;
        const slides = document.querySelectorAll('.slideshow-bg .slide');
        const totalSlides = slides.length;

        function nextSlide() {
            slides[slideIndex].classList.remove('active');
            slideIndex = (slideIndex + 1) % totalSlides;
            slides[slideIndex].classList.add('active');
        }

        setInterval(nextSlide, 4000);

        // ===== FUNGSI TOGGLE PASSWORD =====
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // ===== VALIDASI REGISTRASI =====
        function validasiRegistrasi() {
            let firstName = document.getElementById('frist_name').value;
            let lastName = document.getElementById('last_name').value;
            let email = document.getElementById('email').value;
            let password = document.getElementById('password').value;
            let password2 = document.getElementById('password2').value;
            let agree = document.getElementById('agree');
            let pesan = document.getElementById('pesanRegistrasi');

            pesan.innerHTML = '';

            if (firstName === '' || firstName.trim() === '') {
                pesan.innerHTML = '<div class="alert alert-danger">First Name tidak boleh kosong!</div>';
                return false;
            }

            if (lastName === '' || lastName.trim() === '') {
                pesan.innerHTML = '<div class="alert alert-danger">Last Name tidak boleh kosong!</div>';
                return false;
            }

            if (email === '' || email.trim() === '') {
                pesan.innerHTML = '<div class="alert alert-danger">Email tidak boleh kosong!</div>';
                return false;
            }

            if (!email.includes('@') || !email.includes('.')) {
                pesan.innerHTML = '<div class="alert alert-danger">Format email tidak valid!</div>';
                return false;
            }

            if (password === '' || password.length < 6) {
                pesan.innerHTML = '<div class="alert alert-danger">Password minimal 6 karakter!</div>';
                return false;
            }

            if (password !== password2) {
                pesan.innerHTML = '<div class="alert alert-danger">Password dan konfirmasi password tidak sama!</div>';
                return false;
            }

            if (!agree.checked) {
                pesan.innerHTML = '<div class="alert alert-danger">Anda harus menyetujui terms and conditions!</div>';
                return false;
            }

            pesan.innerHTML = '<div class="alert alert-success">✅ Registrasi berhasil! Silakan login.</div>';

            setTimeout(function() {
                window.location.href = 'auth-login.html';
            }, 1500);

            return false;
        }
    </script>
</body>
</html>
